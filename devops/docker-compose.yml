version: "3.9"

services:
  backend:
    build:
      context: ..
      dockerfile: ./devops/Dockerfile.backend
    container_name: subsidy-backend
    env_file:
      - ../.env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      LOG_LEVEL: "INFO"
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  postgres:
    image: postgres:15
    container_name: subsidy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-subsidyledger}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: subsidy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  hardhat:
    image: node:18
    container_name: subsidy-hardhat-node
    working_dir: /app
    volumes:
      - ../blockchain:/app
    command: npx hardhat node
    ports:
      - "8545:8545"
    restart: unless-stopped

volumes:
  postgres_data: