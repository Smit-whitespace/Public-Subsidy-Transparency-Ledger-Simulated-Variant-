version: "3.9"

services:

  postgres:
    image: postgres:15
    container_name: pstl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pstl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pstl}
      POSTGRES_DB: ${POSTGRES_DB:-pstl_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ..
      dockerfile: ./devops/Dockerfile.backend
    container_name: pstl-backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pstl}:${POSTGRES_PASSWORD:-pstl}@postgres:5432/${POSTGRES_DB:-pstl_db}
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ..
      dockerfile: ./devops/Dockerfile.frontend
    container_name: pstl-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data: